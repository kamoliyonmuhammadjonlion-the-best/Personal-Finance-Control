function flowChart(data,month,sixMonths=false){
 const points=sixMonths?Array.from({length:6},(_,i)=>{const m=Core.addMonths(month,i-5),t=Core.totals(Core.txs(data,m));return{date:m+'-01',income:t.income,expense:t.expense,label:new Intl.DateTimeFormat('ru-RU',{month:'short',timeZone:'UTC'}).format(new Date(m+'-01T12:00:00Z'))}}):Core.daily(data,month);
 const max=Math.max(...points.map(p=>Math.max(p.income,p.expense)));
 if(max===0)return `<div class="chart-empty">${icon('chart')}<span>Добавь операции — здесь появится динамика</span></div>`;
 const W=680,H=225,left=48,right=10,top=12,bottom=32,plotH=H-top-bottom,plotW=W-left-right,step=plotW/points.length,bw=Math.min(18,step*.3);
 const ceiling=Math.max(100,Math.ceil(max/100)*100);
 const y=v=>top+plotH-(v/ceiling)*plotH;
 const lines=Array.from({length:5},(_,i)=>{const v=ceiling*i/4,yy=y(v);return `<line class="gridline" x1="${left}" x2="${W-right}" y1="${yy}" y2="${yy}"/><text x="${left-8}" y="${yy+3}" text-anchor="end">${esc(compact(v))}</text>`}).join('');
 const bars=points.map((p,i)=>{
  const x=left+step*i+step/2;
  const label=sixMonths?p.label:String(i+1).padStart(2,'0');
  const showLabel=sixMonths||i===0||i===points.length-1||(i+1)%5===0;
  return `<a href="#main" data-chart-date="${p.date}" data-chart-month="${sixMonths?p.date.slice(0,7):''}" aria-label="${esc((sixMonths?monthLabel(p.date.slice(0,7)):dateLabel(p.date))+': доходы '+fmt(p.income)+', расходы '+fmt(p.expense))}">
  <title>${esc((sixMonths?monthLabel(p.date.slice(0,7)):dateLabel(p.date))+': доходы '+fmt(p.income)+' · расходы '+fmt(p.expense))}</title>
  <rect class="bar-hit" x="${x-step/2}" y="0" width="${step}" height="${H}"/>
  <rect x="${x-bw-1}" y="${y(p.income)}" width="${bw}" height="${p.income?Math.max(2,plotH*p.income/ceiling):0}" rx="2" fill="var(--accent)"/>
  <rect x="${x+1}" y="${y(p.expense)}" width="${bw}" height="${p.expense?Math.max(2,plotH*p.expense/ceiling):0}" rx="2" fill="var(--violet)"/>
  ${showLabel?`<text x="${x}" y="${H-7}" text-anchor="middle">${esc(label)}</text>`:''}</a>`;
 }).join('');
 return `<svg class="flow" viewBox="0 0 ${W} ${H}" role="img" aria-label="${sixMonths?'Доходы и расходы по месяцам':'Доходы и расходы по дням'}"><title>Доходы и расходы. Выбери столбец, чтобы открыть операции.</title>${lines}${bars}</svg>`;
}
function categoryChart(items,type='expense'){
 const cats=Core.byCategory(items,type),total=Core.sum(cats.map(c=>c.total));
 if(!total)return `<div class="chart-empty">${icon('basket')}<span>${type==='expense'?'Нет расходов':'Нет доходов'} за этот период</span></div>`;
 let offset=0;
 const rings=cats.map(c=>{const len=c.total/total*100,part=`<circle cx="80" cy="80" r="65" fill="none" stroke="${c.color}" stroke-width="15" pathLength="100" stroke-dasharray="${Math.max(0,len-.9)} ${100-Math.max(0,len-.9)}" stroke-dashoffset="${-offset}"><title>${esc(c.name+': '+fmt(c.total))}</title></circle>`;offset+=len;return part}).join('');
 const displayCats=cats.slice(0,5);
 return `<div class="donut-wrap"><div class="donut"><svg viewBox="0 0 160 160" aria-label="Распределение по категориям" role="img"><circle cx="80" cy="80" r="65" fill="none" stroke="var(--card2)" stroke-width="15"/>${rings}</svg><div class="donut-middle"><small>${type==='expense'?'РАСХОДЫ':'ДОХОДЫ'}</small><strong>${esc(fmt(total,false))}</strong><small>TJS за месяц</small></div></div><div class="category-legend">${displayCats.map(c=>`<button data-action="filter-category" data-category="${c.id}" title="${esc(c.name+': '+fmt(c.total))}"><i style="background:${c.color}"></i><span class="cat-name">${c.name}</span><b>${ui.privacy?'••':Math.round(c.total/total*100)+'%'}</b></button>`).join('')}${cats.length>5?`<button data-page="analytics"><span class="cat-name">Ещё ${cats.length-5} категории</span>${icon('arrow')}</button>`:''}</div></div>`;
}

function filteredTransactions(){

 if(ui.date)items=items.filter(t=>t.date===ui.date);
 const q=ui.search.trim().toLocaleLowerCase('ru');
 if(q)items=items.filter(t=>[t.title,t.note,labelCategory(t.category),accountName(t.accountId),t.type==='transfer'?accountName(t.toAccountId):''].join(' ').toLocaleLowerCase('ru').includes(q));
 return sortedTx(items);
}

function analyticsPage(){
 const data=state(),items=Core.txs(data,ui.month),t=Core.totals(items),days=Core.daily(data,ui.month),expenseItems=items.filter(x=>x.type==='expense');
 const today=Core.today(),first=ui.month+'-01',end=Core.addMonths(ui.month,1)+'-01';
 const elapsed=today<first?0:today>=end?days.length:Number(today.slice(8));
 const maxDay=[...days].sort((a,b)=>b.expense-a.expense)[0];
 const noSpend=days.filter(d=>d.date<=today&&d.expense===0).length;
 const prevMonth=Core.addMonths(ui.month,-1);
 const previous=Core.txs(data,prevMonth).filter(x=>ui.month===today.slice(0,7)?Number(x.date.slice(8))<=Number(today.slice(8)):true);
 const prevExpense=Core.totals(previous).expense;
 const comparison=prevExpense?Math.round((t.expense-prevExpense)/prevExpense*100):null;
 const cats=Core.byCategory(items),incomeCats=Core.byCategory(items,'income');
 const calendarOffset=(new Date(first+'T12:00:00Z').getUTCDay()+6)%7;
 const heatMax=Math.max(1,...days.map(d=>d.expense));
 const calendar=`<div class="calendar-week">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<div>${d}</div>`).join('')}</div><div class="calendar-days">${'<div></div>'.repeat(calendarOffset)}${days.map(d=>{
  const level=d.expense?Math.max(1,Math.ceil(d.expense/heatMax*4)):0;
  return `<button class="day ${!ui.privacy&&level?'level'+level:''} ${d.date===today?'today':''} ${d.date>today?'future':''}" data-action="day-txs" data-date="${d.date}" ${d.date>today?'disabled':''} aria-label="${esc(dateLabel(d.date)+', расходы '+fmt(d.expense))}" title="${esc(dateLabel(d.date)+': '+fmt(d.expense))}"><span>${Number(d.date.slice(8))}</span><small>${d.date>today?'':ui.privacy?'••':d.expense?esc(compact(d.expense)):'—'}</small></button>`;
 }).join('')}</div>`;
 const metric=(label,value,note='')=>`<div><div><span class="mini-label">${label}</span>${note?`<p class="small soft" style="margin-top:3px">${note}</p>`:''}</div><strong>${value}</strong></div>`;
 const metrics=metric('В среднем в день',elapsed?esc(fmt(Math.round(t.expense/elapsed))):'—',`${elapsed} прошедших дней периода`)+
 metric('Средний расход',expenseItems.length?esc(fmt(Math.round(t.expense/expenseItems.length))):'—','На одну расходную операцию')+
 metric('Самый затратный день',maxDay.expense?esc(fmt(maxDay.expense)):'—',maxDay.expense?dateLabel(maxDay.date):'Нет расходов')+
 metric('Дни без записанных расходов',String(noSpend),'Не обязательно означают отсутствие трат')+

function openDialog(title,body,onSubmit=null,submitText='Сохранить'){
 dialogFocus=document.activeElement;dialogHandler=onSubmit;
 $('#modalTitle').textContent=title;
 $('#modalBody').innerHTML=onSubmit?`<form id="dialogForm">${body}<div class="form-error" id="dialogError" role="alert"></div><div class="form-actions"><button type="button" class="btn" data-action="close-modal">Отмена</button><button type="submit" class="btn btn-primary">${esc(submitText)}</button></div></form>`:body;
 if(!$('#modal').open)$('#modal').showModal();
 const f=$('#dialogForm');
 if(f)f.addEventListener('submit',event=>{
  event.preventDefault();if(f.dataset.busy==='yes')return;
  f.dataset.busy='yes';
  try{dialogHandler(f);closeDialog()}catch(err){$('#dialogError').textContent=err.message;f.dataset.busy='no'}
 });
}
function closeDialog(){$('#modal').close();dialogHandler=null;const target=dialogFocus;dialogFocus=null;if(target?.isConnected)target.focus()}

 const body=`<div class="form-grid">

 <div class="field full"><label for="fAmount">Сумма, TJS</label><input class="money-input" name="amount" id="fAmount" inputmode="decimal" value="${t.amountMinor?decimal(t.amountMinor):''}" placeholder="0,00" required autocomplete="off"></div>
 ${field('Описание','fTitle','text',t.title,'required maxlength="160"',true)}
 <div class="field"><label for="fAccount">Счёт списания / зачисления</label><select name="account" id="fAccount">${accountOptions(t.accountId,t.accountId)}</select></div>
 <div class="field" id="categoryField" ${t.type==='transfer'?'hidden':''}><label for="fCategory">Категория</label><select name="category" id="fCategory">${catOptions(t.type==='transfer'?'expense':t.type,t.category)}</select></div>
 <div class="field" id="toField" ${t.type!=='transfer'?'hidden':''}><label for="fTo">Счёт получателя</label><select name="to" id="fTo"><option value="">Выбери счёт</option>${accountOptions(dest,dest)}</select></div>
 ${field('Фактическая дата','fDate','date',t.date,`required min="1900-01-01" max="${Core.today()}"`)}
 <div class="field full"><label for="fNote">Заметка · необязательно</label><textarea name="note" id="fNote" maxlength="1000" placeholder="Место, детали покупки или комментарий">${esc(t.note)}</textarea></div></div>
 <div class="note" id="transferNote" style="margin-top:15px" ${t.type!=='transfer'?'hidden':''}>Перевод не считается доходом или расходом. Комиссию банка запиши отдельным расходом.</div>
 ${t.planKey?'<div class="note" style="margin-top:15px">Это подтверждение планового платежа. В баланс попадёт только одна операция с указанной фактической датой.</div>':''}`;
 openDialog(existing?'Изменить операцию':t.planKey?'Подтвердить платёж':'Новая операция',body,f=>{
  const type=f.querySelector('#fType').value,amountMinor=Core.parseMoney(f.querySelector('#fAmount').value);

function exportCSV(items){

 const safeText=v=>/^[=+\-@\t\r\n]/.test(String(v).trimStart())?"'"+v:v;
 const rows=[['Дата','Тип','Описание','Категория','Счёт','Счёт получателя','Сумма TJS','Заметка']];
 for(const t of items)rows.push([t.date,{expense:'Расход',income:'Доход',transfer:'Перевод'}[t.type],safeText(t.title),labelCategory(t.category),safeText(accountName(t.accountId)),t.toAccountId?safeText(accountName(t.toAccountId)):'',decimal(t.type==='expense'?-t.amountMinor:t.amountMinor).replace('.',','),safeText(t.note)]);
 downloadText('\uFEFF'+rows.map(r=>r.map(quote).join(';')).join('\r\n'),`finance-os-operations-${Core.today()}.csv`,'text/csv;charset=utf-8');
 toast('CSV подготовлен. Экспорт содержит настоящие суммы.');
}
function previewImport(raw){
 const data=Core.validate(raw),isDemo=!!raw.demo;
 const counts=`<div class="import-facts"><div>Операции <b>${data.transactions.length}</b></div><div>Счета <b>${data.accounts.length}</b></div><div>Бюджеты <b>${data.budgets.length}</b></div><div>Цели <b>${data.goals.length}</b></div><div>Планы <b>${data.plans.length}</b></div><div>Валюта <b>TJS</b></div></div>`;
 openDialog('Проверка резервной копии',`<p class="muted small">Формат и связи записей проверены. Выбери способ восстановления.</p>${isDemo?'<div class="note danger-text" style="margin-top:14px">Это резервная копия демонстрационных данных, не реальные операции.</div>':''}${counts}
 <div class="field"><label for="importMode">Способ импорта</label><select id="importMode"><option value="merge">Объединить без дублей</option><option value="replace">Заменить текущую базу</option></select></div>
 <div class="note" style="margin-top:15px">При объединении идентичные записи пропускаются. Разные записи с одинаковым ID вызовут ошибку без изменения базы. Перед применением сохраняется локальный снимок; для независимой копии сначала скачай JSON текущей базы.</div>`,()=>{
  const mode=$('#importMode').value;
  let next=JSON.parse(JSON.stringify(data));
  if(mode==='merge'){
   next=JSON.parse(JSON.stringify(state()));
   for(const collection of ['accounts','transactions','budgets','goals','plans']){
    const map=new Map(next[collection].map(x=>[x.id,x]));
    for(const entry of data[collection]){
     const same=map.get(entry.id);
     if(same&&JSON.stringify(same)!==JSON.stringify(entry))throw Error('Конфликт ID в разделе «'+collection+'». Объединение отменено. Для полного восстановления выбери замену.');
     if(!same){next[collection].push(entry);map.set(entry.id,entry)}
    }
   }
  }
  next=Core.validate(next);
  if(ui.demo){demoData=next;undo=null;render();toast('Импорт применён только к деморежиму.');return}
  const current=localStorage.getItem(KEY);if(current!==lastRaw)throw Error('Данные изменились в другой вкладке. Перезагрузи страницу.');
  // Keep the original raw value, including malformed data, before replacing it.
  if(current)localStorage.setItem(KEY+'.before_import',current);
  next.revision=realData.revision+1;next.updatedAt=new Date().toISOString();
  const text=JSON.stringify(next);localStorage.setItem(KEY,text);lastRaw=text;realData=next;blocked=false;saveIssue='';undo=null;render();toast('Данные восстановлены.');
 },'Применить импорт');
}

 d.goals=[{id:'demo_goal_laptop',name:'Новый ноутбук',targetMinor:1800000,dueDate:Core.addMonths(month,5)+'-15',contributions:[{id:'demo_contribution',date:today,amountMinor:saved}]},{id:'demo_goal_vacation',name:'Небольшое путешествие',targetMinor:700000,dueDate:Core.addMonths(month,3)+'-20',contributions:[]}];
 d.plans=[{id:'demo_plan_internet',name:'Домашний интернет',type:'expense',amountMinor:15000,category:'home',accountId:'card',startDate:month+'-25',repeat:'monthly',active:true},{id:'demo_plan_phone',name:'Мобильная связь',type:'expense',amountMinor:6000,category:'home',accountId:'card',startDate:month+'-28',repeat:'monthly',active:true}];
 return Core.validate(d);
}
function toggleDemo(){
 if(ui.demo){ui.demo=false}else{demoData=makeDemo();ui.demo=true}
 ui.month=Core.today().slice(0,7);ui.page='dashboard';resetFilters();undo=null;$('#toast').hidden=true;render();toggleMenu(false);window.scrollTo({top:0,behavior:'instant'});
}
function resetFilters(){ui.search='';ui.type='all';ui.account='all';ui.category='all';ui.date='';ui.allTime=false;ui.pageNo=1}
function syncSidebar(){
 const mobile=window.innerWidth<=740,open=$('#sidebar').classList.contains('open');
 $('#sidebar').inert=mobile&&!open;
 if(mobile&&!open)$('#sidebar').setAttribute('aria-hidden','true');else $('#sidebar').removeAttribute('aria-hidden');
}
function toggleMenu(open){
 const wasOpen=$('#sidebar').classList.contains('open');
 $('#sidebar').classList.toggle('open',open);$('#overlay').classList.toggle('open',open);$('#menuBtn').setAttribute('aria-expanded',String(open));syncSidebar();
 if(open)$('#nav button')?.focus();else if(wasOpen&&window.innerWidth<=740)$('#menuBtn').focus();
}

function bindPage(){
 $('#periodMonth')?.addEventListener('change',event=>{if(!Core.monthValid(event.target.value)){event.target.value=ui.month;return}ui.month=event.target.value;ui.date='';ui.pageNo=1;render()});
 $('#quickType')?.addEventListener('change',()=>{
  ui.quickType=$('#quickType').value;$('#quickCategory').innerHTML=catOptions(ui.quickType);$('#quickTitle').placeholder=ui.quickType==='expense'?'На что потратил?':'Откуда доход?';
 });
 $('#quickForm')?.addEventListener('submit',event=>{
  event.preventDefault();const form=event.currentTarget;if(form.dataset.busy==='yes')return;form.dataset.busy='yes';
  try{
   const amountMinor=Core.parseMoney($('#quickAmount').value);
   if(amountMinor<=0)throw Error('Сумма должна быть больше нуля.');
   const accountId=$('#quickAccount').value;
   const t={id:Core.uid(),type:$('#quickType').value,title:$('#quickTitle').value.trim(),amountMinor,accountId,toAccountId:null,category:$('#quickCategory').value,date:Core.today(),note:'',createdAt:new Date().toISOString(),planKey:''};
   commit(d=>d.transactions.push(t),'Операция записана сегодняшним числом');ui.lastAccount=accountId;if($('#quickAccount'))$('#quickAccount').value=accountId;$('#quickAmount')?.focus();
  }catch(err){$('#quickError').textContent=err.message;form.dataset.busy='no'}
 });
 $('#searchTx')?.addEventListener('input',event=>{ui.search=event.target.value;ui.pageNo=1;$('#transactionResults').innerHTML=transactionResults()});
 [['filterType','type'],['filterAccount','account'],['filterCategory','category']].forEach(([id,key])=>{
  $('#'+id)?.addEventListener('change',event=>{ui[key]=event.target.value;ui.pageNo=1;$('#transactionResults').innerHTML=transactionResults()});
 });
 $('#allTime')?.addEventListener('change',event=>{ui.allTime=event.target.checked;ui.pageNo=1;$('#transactionResults').innerHTML=transactionResults()});
 $('#settingsTheme')?.addEventListener('change',event=>{try{commit(d=>d.settings.theme=event.target.value)}catch(err){errorToast(err);render()}});
}
function handleAction(action,el){
 const id=el?.dataset.id;
 switch(action){
  case 'close-modal':closeDialog();break;
  case 'new-tx':txModal();break;
  case 'edit-tx':txModal(id);break;
  case 'duplicate-tx':{const t=getTx(id);txModal(null,{...t,id:undefined,createdAt:undefined,planKey:'',date:Core.today(),accountId:acc(t.accountId)?.archived?activeAccount():t.accountId});break}
  case 'delete-tx':{const t=getTx(id);confirmAction('Удалить операцию?',`«${t.title}» · ${fmt(t.amountMinor)}. ${t.type==='transfer'?'Будут отменены обе стороны перевода.':''} ${t.planKey?'Плановый платёж снова станет неподтверждённым.':''} Действие можно отменить до следующего изменения.`,()=>commit(d=>{d.transactions=d.transactions.filter(x=>x.id!==id)},'Операция удалена',true),'Удалить');break}
  case 'template':txModal(null,{title:el.dataset.title,category:el.dataset.category});break;
  case 'transfer':if(state().accounts.filter(a=>!a.archived).length<2)throw Error('Для перевода нужны хотя бы два активных счёта.');txModal(null,{type:'transfer',title:'Перевод между счетами'});break;
  case 'new-budget':budgetModal();break;
  case 'edit-budget':budgetModal(id);break;
  case 'delete-budget':confirmAction('Удалить лимит?','Операции сохранятся. Будет удалён только выбранный бюджет.',()=>commit(d=>{d.budgets=d.budgets.filter(b=>b.id!==id)},'Лимит удалён',true),'Удалить');break;
  case 'copy-budgets':{
   const previous=state().budgets.filter(b=>b.month===Core.addMonths(ui.month,-1));
   const additions=previous.filter(b=>!state().budgets.some(x=>x.month===ui.month&&x.category===b.category)).map(b=>({...b,id:Core.uid(),month:ui.month}));
   if(!additions.length){toast('Все лимиты прошлого месяца уже есть в выбранном месяце.');break}
   commit(d=>d.budgets.push(...additions),`Скопировано лимитов: ${additions.length}`);break;
  }
  case 'new-goal':goalModal();break;
  case 'edit-goal':goalModal(id);break;
  case 'contribute':contributionModal(id);break;
  case 'release':contributionModal(id,true);break;
  case 'goal-history':goalHistory(id);break;
  case 'delete-goal':confirmAction('Удалить цель?','Резерв этой цели будет освобождён. Общий баланс и история банковских операций не изменятся.',()=>commit(d=>{d.goals=d.goals.filter(g=>g.id!==id)},'Цель удалена',true),'Удалить');break;
  case 'new-account':accountModal();break;
  case 'edit-account':accountModal(id);break;
  case 'account-txs':resetFilters();ui.account=id;ui.allTime=true;navigate('transactions');break;
  case 'new-plan':planModal();break;
  case 'edit-plan':planModal(id);break;
  case 'pause-plan':confirmAction('Остановить план?','План исчезнет из активного календаря. Уже проведённые операции сохранятся. План можно возобновить в разделе остановленных.',()=>commit(d=>{d.plans.find(p=>p.id===id).active=false},'План остановлен',true),'Остановить');break;
  case 'resume-plan':{
   const p=state().plans.find(p=>p.id===id);if(!p)throw Error('План не найден.');if(acc(p.accountId)?.archived)throw Error('Сначала восстанови счёт этого плана из архива.');
   commit(d=>{d.plans.find(p=>p.id===id).active=true},'План возобновлён');break;
  }
  case 'pay-plan':{
   const p=Core.occurrences(state(),ui.month).find(p=>p.id===id);if(!p||p.paid)throw Error('Этот платёж уже проведён или недоступен.');
   txModal(null,{type:p.type,title:p.name,amountMinor:p.amountMinor,category:p.category,accountId:p.accountId,date:Core.today(),planKey:p.key});break;
  }
  case 'filter-category':resetFilters();ui.category=el.dataset.category;navigate('transactions');break;
  case 'day-txs':resetFilters();ui.date=el.dataset.date;ui.month=ui.date.slice(0,7);navigate('transactions');break;
  case 'clear-date':ui.date='';render();break;
  case 'reset-filters':resetFilters();render();break;
  case 'page-prev':ui.pageNo=Math.max(1,ui.pageNo-1);$('#transactionResults').innerHTML=transactionResults();break;
  case 'page-next':ui.pageNo++;$('#transactionResults').innerHTML=transactionResults();break;
  case 'prev-month':changeMonth(-1);break;
  case 'next-month':changeMonth(1);break;
  case 'privacy':ui.privacy=!ui.privacy;render();break;
  case 'demo':toggleDemo();break;
  case 'help':helpModal();break;
  case 'commands':commandsModal();break;
  case 'print':window.print();break;
  case 'export':exportData();break;
  case 'export-html':exportHtmlCopy();break;
  case 'import':$('#importFile').click();break;
  case 'csv':exportCSV(filteredTransactions());break;
  case 'csv-all':exportCSV(sortedTx(state().transactions));break;
  case 'raw-export':if(lastRaw)downloadText(lastRaw,`finance-os-original-${Core.today()}.json`);break;
  case 'recover-snapshot':{
   const raw=localStorage.getItem(KEY+'.before_import');if(!raw)throw Error('Копии до импорта пока нет.');
   downloadText(raw,`finance-os-before-import-${Core.today()}.json`);toast('Снимок подготовлен для скачивания.');break;
  }
  case 'reset':resetModal();break;
 }
}
document.addEventListener('click',event=>{
 const target=event.target instanceof Element?event.target:null;if(!target)return;
 try{
  const command=target.closest('[data-command],[data-command-page]');
  if(command){event.preventDefault();closeDialog();if(command.dataset.commandPage)navigate(command.dataset.commandPage);else handleAction(command.dataset.command,command);return}
  const chart=target.closest('[data-chart-date]');
  if(chart){event.preventDefault();resetFilters();ui.month=chart.dataset.chartDate.slice(0,7);if(!chart.dataset.chartMonth)ui.date=chart.dataset.chartDate;navigate('transactions');return}
  const nav=target.closest('[data-page]');
  if(nav){event.preventDefault();navigate(nav.dataset.page);return}
  const el=target.closest('[data-action]');
  if(el){event.preventDefault();handleAction(el.dataset.action,el)}
 }catch(error){errorToast(error)}
});
$('#importFile').addEventListener('change',async event=>{
 const input=event.currentTarget,file=input.files[0];if(!file)return;
 try{if(file.size>25*1024*1024)throw Error('Файл больше 25 МБ. Импорт отменён.');const text=await file.text();previewImport(JSON.parse(text))}catch(error){errorToast(error instanceof SyntaxError?new Error('В файле некорректный JSON. Данные не изменены.'):error)}finally{input.value=''}
});
$('#undoBtn').addEventListener('click',()=>{
 try{
  if(!undo||undo.demo!==ui.demo||undo.revision!==state().revision)throw Error('После удаления данные изменились. Отмена больше недоступна.');
  const restore=undo.before;
  commit(d=>{for(const k of ['accounts','transactions','budgets','goals','plans','settings'])d[k]=restore[k]},'Удаление отменено');
 }catch(error){errorToast(error)}
});
$('#privacyBtn').addEventListener('click',()=>handleAction('privacy'));
$('#themeBtn').addEventListener('click',()=>{try{commit(d=>d.settings.theme=d.settings.theme==='dark'?'light':'dark')}catch(error){errorToast(error)}});
$('#menuBtn').addEventListener('click',()=>toggleMenu(!$('#sidebar').classList.contains('open')));
$('#overlay').addEventListener('click',()=>toggleMenu(false));
$('#closeModal').addEventListener('click',closeDialog);
$('#modal').addEventListener('click',event=>{if(event.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeDialog()}});
document.addEventListener('keydown',event=>{
 if(event.key==='Escape')toggleMenu(false);
 if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if(!$('#modal').open)commandsModal()}
 if(event.altKey&&event.code==='KeyN'){event.preventDefault();if(!$('#modal').open)txModal()}
});
window.addEventListener('storage',event=>{
 if(event.key!==KEY||ui.demo)return;
 if($('#modal').open){saveIssue='Данные изменились в другой вкладке. Закрой форму и перезагрузи страницу перед сохранением.';return}
 try{const current=localStorage.getItem(KEY);realData=current?Core.validate(JSON.parse(current)):Core.newData();lastRaw=current;saveIssue='';blocked=false;undo=null;render();toast('Данные обновлены из другой вкладки.')}catch(error){blocked=true;saveIssue='Не удалось прочитать изменения другой вкладки. Экспортируй текущие данные и проверь хранилище.';render()}
});
window.addEventListener('resize',()=>{if(window.innerWidth>740)toggleMenu(false);else syncSidebar()});
$('#menuBtn').innerHTML=icon('menu');
$('#closeModal').innerHTML=icon('close');
$('.help-button').innerHTML=icon('help');
$('#mainAdd').innerHTML=icon('plus')+'<span>Добавить операцию</span>';
load();render();
// Expose deterministic calculations for audit and testing; no data or write methods.
window.FinanceCore=Core;
</script></body></html>
